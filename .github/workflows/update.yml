name: Mise à jour du radar

on:
  schedule:
    - cron: "7 */2 * * *"   # toutes les 2 h (minute 7 : évite les heures pleines, très chargées sur GitHub)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Collecte et export
        run: python -m pipeline.run

      - name: Enregistrer les données
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
